version: '3.8'
services:
  web:
    build: .
    ports:
    - "5000:5000"
    environment:
    - .env.docker
    depends_on:
    - db
    volumes:
    - .:/app
  db:
    image: mysql:8.0
    environment:
    - .env.docker
    ports:
      - "3306:3307"
    volumes:
      - mysql_data:/var/lib/mysql

  

volumes:
  mysql_data:
